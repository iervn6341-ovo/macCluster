    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maccluster-network-test-read-leases-20261018
  namespace: kube-node-lease
subjects:
  - kind: ServiceAccount
    name: maccluster-network-controller
    namespace: maccluster-net-test-20261018
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maccluster-network-test-read-leases-20261018
