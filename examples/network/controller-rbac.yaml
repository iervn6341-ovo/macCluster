    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: maccluster-network-test-read-nodes-20261018
subjects:
  - kind: ServiceAccount
    name: maccluster-network-controller
    namespace: maccluster-net-test-20261018
roleRef:
  apiGroup: rbac.authorization.k8s.io
