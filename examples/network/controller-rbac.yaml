    name: maccluster-network-controller
    namespace: maccluster-net-test-20261018
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maccluster-network-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: maccluster-network-test-read-nodes-20261018
