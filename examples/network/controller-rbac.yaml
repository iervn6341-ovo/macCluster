# Superseded by `maccluster-agent network-controller-manifests` (docs/service-controller-plan.md): kept as the earlier test example.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maccluster-network-controller
  namespace: maccluster-net-test-20261018
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maccluster-network-controller
  namespace: maccluster-net-test-20261018
rules:
  - apiGroups: [""]
    resources: [services, pods]
    verbs: [get, list, watch]
