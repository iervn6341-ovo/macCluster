apiVersion: v1
kind: Namespace
metadata:
  name: maccluster-test
  labels:
    maccluster.example.com/test: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: maccluster-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maccluster-nginx
  template:
    metadata:
      labels:
        app: maccluster-nginx
        maccluster.example.com/managed: "true"
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        maccluster.example.com/host: maccluster-node
      tolerations:
        - key: maccluster.example.com/prototype
          value: "true"
          effect: NoSchedule
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: native-http
  namespace: maccluster-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maccluster-native-http
  template:
    metadata:
      labels:
        app: maccluster-native-http
        maccluster.example.com/managed: "true"
        maccluster.example.com/executor: native
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        maccluster.example.com/host: maccluster-node
      tolerations:
        - key: maccluster.example.com/prototype
          value: "true"
          effect: NoSchedule
      containers:
        - name: http
          # Native image is metadata only; executable must already exist on Mac.
          image: native/python-http:local
          command: [/usr/bin/python3]
          args: [-m, http.server, "$(MACCLUSTER_PORT)", --bind, "127.0.0.1", --directory, /private/tmp]
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /
              port: 8000
